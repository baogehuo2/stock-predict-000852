      date_role: release
      frequency: monthly
      unit: percent
    - key: US_UNEMPLOYMENT_RATE
      name: 美国失业率
      function: macro_usa_unemployment_rate
      date_role: period
      frequency: monthly
      unit: percent
    - key: US_NON_FARM
      name: 美国非农就业
      function: macro_usa_non_farm
      date_role: release
