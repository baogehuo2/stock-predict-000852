    - key: US_RETAIL_SALES
      name: 美国零售销售
      function: macro_usa_retail_sales
      date_role: release
      frequency: monthly
      unit: percent
    - key: US_INDUSTRIAL_PRODUCTION
      name: 美国工业产出
      function: macro_usa_industrial_production
      date_role: release
      frequency: monthly
      unit: percent
    - key: US_ISM_PMI
      name: 美国ISM制造业PMI
